spring:
  application:
    name: bluemoon-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:bluemoon}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: oracle.jdbc.OracleDriver

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-change-me-please-change-me}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}
  seed-cash-balance: 10000000
  rag-service:
    base-url: ${RAG_SERVICE_URL:http://localhost:8000}
  kis:
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    account-no: ${KIS_ACCOUNT_NO:}
    base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.bluemoon.backend: INFO
