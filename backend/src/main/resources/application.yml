spring:
  application:
    name: bluemoon-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:bluemoon}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: oracle.jdbc.OracleDriver

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  flyway:
    # Oracle Autonomous DB의 ADMIN 스키마는 앱 테이블이 없어도 오라클 기본 시스템 객체 때문에
    # Flyway가 "non-empty schema"로 판단해 baseline 없이는 마이그레이션을 거부함.
    # baseline-version을 0으로 둬서 V1부터 정상적으로 전부 적용되도록 함(V1이 스킵되면 안 됨).
    baseline-on-migrate: true
    baseline-version: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-change-me-please-change-me}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}
  seed-cash-balance: 10000000
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  newsdata:
    api-key: ${NEWSDATA_API_KEY:}
    base-url: ${NEWSDATA_BASE_URL:https://newsdata.io}
  kis:
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    account-no: ${KIS_ACCOUNT_NO:}
    base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.bluemoon.backend: INFO
