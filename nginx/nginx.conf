events {
  worker_connections 1024;
}

http {
  upstream backend {
    server backend:8080;
  }

  server {
    listen 80;
    server_name 129-225-204-191.sslip.io;

    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name 129-225-204-191.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/129-225-204-191.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/129-225-204-191.sslip.io/privkey.pem;

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://backend/actuator/health;
    }
  }
}
